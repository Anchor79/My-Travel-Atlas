<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Travel Atlas</title>

    <link rel="stylesheet" href="css/style.css">
</head>


<body>

    <!-- 顶部 -->
    <header class="site-header">

        <div class="logo">
            MY TRAVEL ATLAS
        </div>

        <div class="header-subtitle">
            一张不断扩展的个人世界地图
        </div>

    </header>


    <!-- 主体 -->
    <main class="main-layout">


        <!-- 左侧：世界目录 -->
        <aside class="sidebar">

            <div class="sidebar-title">
                EXPLORE
            </div>


            <!-- 亚洲 -->
            <div class="continent">

                <div class="continent-title">
                    <span>▼</span>
                    亚洲
                </div>


                <div class="country-list">

                    <div class="country">
                        中国
                    </div>

                    <div class="country">
                        日本
                    </div>

                    <div class="country">
                        韩国
                    </div>

                </div>

            </div>


            <!-- 欧洲 -->
            <div class="continent">

                <div class="continent-title">
                    <span>▶</span>
                    欧洲
                </div>

            </div>


            <!-- 北美洲 -->
            <div class="continent">

                <div class="continent-title">
                    <span>▶</span>
                    北美洲
                </div>

            </div>


            <!-- 南美洲 -->
            <div class="continent">

                <div class="continent-title">
                    <span>▶</span>
                    南美洲
                </div>

            </div>


            <!-- 非洲 -->
            <div class="continent">

                <div class="continent-title">
                    <span>▶</span>
                    非洲
                </div>

            </div>


            <!-- 大洋洲 -->
            <div class="continent">

                <div class="continent-title">
                    <span>▶</span>
                    大洋洲
                </div>

            </div>

        </aside>



        <!-- 中央区域 -->
        <section class="globe-section">


            <div class="globe-title">
                EXPLORE THE WORLD
            </div>


            <!-- 目前只是地球占位符 -->
            <div class="globe">

                <div class="globe-symbol">
                    🌍
                </div>

            </div>


            <div class="globe-description">

                <h1>
                    My Travel Atlas
                </h1>

                <p>
                    记录我去过的地方，
                    旅行故事，以及那些值得分享的攻略。
                </p>

            </div>


        </section>



        <!-- 右侧信息 -->
        <aside class="info-panel">


            <div class="info-title">
                MY JOURNEY
            </div>


            <div class="stat">

                <div class="stat-number">
                    0
                </div>

                <div class="stat-label">
                    COUNTRIES
                </div>

            </div>


            <div class="stat">

                <div class="stat-number">
                    0
                </div>

                <div class="stat-label">
                    CITIES
                </div>

            </div>


            <div class="stat">

                <div class="stat-number">
                    0
                </div>

                <div class="stat-label">
                    TRAVEL NOTES
                </div>

            </div>


        </aside>


    </main>



    <!-- 底部 -->
    <footer>

        <span>
            MY TRAVEL ATLAS
        </span>

        <span>
            A PERSONAL MAP OF PLACES I'VE BEEN
        </span>

    </footer>


    <script src="js/main.js"></script>

</body>

</html>
