<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Travel Atlas</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f3ee;
            color: #222;
        }

        header {
            padding: 40px;
            text-align: center;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 18px;
        }

        .globe-placeholder {
            width: 500px;
            height: 500px;
            margin: 50px auto;
            border-radius: 50%;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        .content {
            max-width: 1000px;
            margin: auto;
            padding: 40px;
        }
    </style>
</head>

<body>

<header>
    <h1>My Travel Atlas</h1>

    <div class="subtitle">
        一张不断扩展的个人世界地图，记录去过的地方、旅行故事与实用攻略。
    </div>
</header>


<div class="globe-placeholder">
    🌍
</div>


<div class="content">

    <h2>Explore</h2>

    <p>
        从世界开始，探索我去过的地方。
    </p>

    <h3>🌏 亚洲</h3>

    <h3>🌍 欧洲</h3>

    <h3>🌎 北美洲</h3>

    <h3>🌎 南美洲</h3>

    <h3>🌍 非洲</h3>

    <h3>🌏 大洋洲</h3>

</div>

</body>
</html>
